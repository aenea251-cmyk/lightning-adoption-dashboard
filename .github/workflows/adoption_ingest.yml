name: adoption-ingest

on:
  schedule:
    - cron: "*/30 * * * *"  # every 30 minutes
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ingestion
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
          MOLTX_API_KEY: ${{ secrets.MOLTX_API_KEY }}
          # scale targets
          MOLTBOOK_TARGET_POSTS: "100000"
          MOLTX_TARGET_UNIQUE_POSTS: "50000"
          HOTMOLTS_TARGET_POSTS: "20000"
          HOTMOLTS_TIME_BUDGET_SEC: "300"
          HOTMOLTS_WORKERS: "24"
        run: |
          python3 update_adoption.py

      - name: Commit & push updated data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "adoption-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lightning/data/adoption.json lightning/data/state.json || true
          git commit -m "Update adoption data" || exit 0
          # Use token-authenticated remote so the workflow can push.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
