name: Update adoption data

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 * * * *"  # hourly

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update lightning/data/adoption.json
        env:
          MOLTX_API_KEY: ${{ secrets.MOLTX_API_KEY }}
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
        run: |
          python update_adoption.py

      - name: Smoke test + regression checks (local)
        run: |
          set -euo pipefail
          test -f lightning/data/adoption.json
          test -f lightning/data/payment_rails.json

          # JSON parses
          node -e "JSON.parse(require('fs').readFileSync('lightning/data/adoption.json','utf8')); console.log('adoption.json ok')"
          node -e "JSON.parse(require('fs').readFileSync('lightning/data/payment_rails.json','utf8')); console.log('payment_rails.json ok')"

          # Required fields exist + collectors fail gracefully
          python -m unittest discover -s tests -q

          # Verify the site can fetch the files at the expected paths (catches 404 regressions)
          python -m http.server 8000 &
          PID=$!
          sleep 1
          curl -fsS http://localhost:8000/lightning/data/adoption.json >/dev/null
          curl -fsS http://localhost:8000/lightning/data/payment_rails.json >/dev/null
          kill $PID

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add lightning/data/adoption.json
          git commit -m "Update adoption.json"
          git push
