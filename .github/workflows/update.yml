name: Update adoption data

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/10 * * * *"  # every 10 minutes

permissions:
  contents: write

concurrency:
  group: update-adoption
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update lightning/data/adoption.json
        env:
          MOLTX_API_KEY: ${{ secrets.MOLTX_API_KEY }}
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
          # Scale targets (keep increasing until 100k+/day is routine)
          # Per-run targets; frequent schedule yields 100k+/day.
          MOLTBOOK_TARGET_POSTS: "20000"
          MOLTX_TARGET_UNIQUE_POSTS: "10000"
          HOTMOLTS_TARGET_POSTS: "500"
          HOTMOLTS_TIME_BUDGET_SEC: "60"
          HOTMOLTS_WORKERS: "24"
        run: |
          python3 update_adoption.py

      - name: Smoke test + regression checks (local)
        run: |
          set -euo pipefail
          test -f lightning/data/adoption.json
          test -f lightning/data/payment_rails.json

          # JSON parses
          node -e "JSON.parse(require('fs').readFileSync('lightning/data/adoption.json','utf8')); console.log('adoption.json ok')"
          node -e "JSON.parse(require('fs').readFileSync('lightning/data/payment_rails.json','utf8')); console.log('payment_rails.json ok')"

          # Required fields exist + collectors fail gracefully
          python -m unittest discover -s tests -q

          # Verify the site can fetch the files at the expected paths (catches 404 regressions)
          python -m http.server 8000 &
          PID=$!
          sleep 1
          curl -fsS http://localhost:8000/lightning/data/adoption.json >/dev/null
          curl -fsS http://localhost:8000/lightning/data/payment_rails.json >/dev/null
          kill $PID

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add lightning/data/adoption.json lightning/data/state.json
          git commit -m "Update adoption data"

          # Avoid non-fast-forward failures when multiple runs land close together.
          git pull --rebase origin main || true
          git push origin HEAD:main
