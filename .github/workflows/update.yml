name: Update adoption data

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 * * * *"  # hourly

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update lightning/data/adoption.json
        env:
          MOLTX_API_KEY: ${{ secrets.MOLTX_API_KEY }}
        run: |
          python update_adoption.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add lightning/data/adoption.json
          git commit -m "Update adoption.json"
          git push
